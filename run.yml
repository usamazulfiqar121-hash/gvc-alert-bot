name: GVC Auto Checker

on:
  schedule:
    - cron: '*/15 * * * *' # Ye har 15 minute baad chalega
  workflow_dispatch: # Taake aap khud bhi manually chala sakein

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run Bot
        run: python bot.py
